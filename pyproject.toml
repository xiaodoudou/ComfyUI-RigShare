[project]
name = "comfyui-rigshare"
description = "Multi-user collaboration for ComfyUI: accounts and login, live-shared workflows, cursors, chat, snapshots and a server monitor."
version = "1.1.0"
license = { file = "LICENSE" }
dependencies = []

# Continued from https://github.com/daxcay/ComfyUI-Nexus (MIT).

[project.urls]
Repository = "https://github.com/xiaodoudou/ComfyUI-RigShare"
Documentation = "https://github.com/xiaodoudou/ComfyUI-RigShare#documentation"
"Bug Tracker" = "https://github.com/xiaodoudou/ComfyUI-RigShare/issues"

[tool.comfy]
PublisherId = "xiaodoudou"
DisplayName = "ComfyUI RigShare"
Icon = "https://raw.githubusercontent.com/xiaodoudou/ComfyUI-RigShare/master/web/rigshare/assets/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
